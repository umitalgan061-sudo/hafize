name: Turkish response adapter
on:
  workflow_dispatch:
    inputs:
      prior_run:
        description: "Run ID with a hafize-tr-adapter artifact (empty starts from base)"
        required: false
        type: string
  push:
    branches: [hafize-turkish-v2]
    paths: ['.github/workflows/turkish-response-training.yml']
permissions:
  contents: read
  actions: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HF_HUB_DISABLE_XET: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: CPU training dependencies
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.7.1
          pip install transformers==4.52.4 peft==0.15.2 huggingface-hub==0.32.4
      - name: Previous Turkish adapter
        if: github.event_name == 'push' || inputs.prior_run != ''
        uses: actions/download-artifact@v4
        with:
          name: hafize-tr-adapter
          run-id: ${{ inputs.prior_run || '44917974094' }}
          github-token: ${{ github.token }}
          path: prior-adapter
      - name: Train and evaluate generated answers
        run: |
          if [ -d prior-adapter ]; then
            python scripts/train-turkish-response.py --prior prior-adapter
          else
            python scripts/train-turkish-response.py
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: hafize-tr-adapter
          path: hafize-tr-adapter/
          retention-days: 90
