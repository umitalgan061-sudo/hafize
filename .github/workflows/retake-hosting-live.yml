name: Retake Firebase Hosting — live release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retake-hosting-live.yml'
  # Twice a day: follow the newest green Retake main when site files changed.
  schedule:
    - cron: '47 5,17 * * *'   # 08:47 and 20:47 Europe/Istanbul
  workflow_dispatch:
    inputs:
      mode:
        description: "pinned = deploy RETAKE_RELEASE_SHA as written (also a deliberate rollback); follow = newest green Retake main"
        type: choice
        options: [pinned, follow]
        default: pinned

permissions:
  contents: read

concurrency:
  group: retake06-firebase-live
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIREBASE_PROJECT_ID: projelerim-8fecd
      RETAKE_SITE_ID: retake06-ua
      # Pinned release: deployed when this file changes on main or on a
      # "pinned" dispatch. The resolve step decides the commit actually
      # deployed (RELEASE_SHA); checkout, guard and marker all use it.
      RETAKE_RELEASE_SHA: 27a289b9ae1fe6c3186d6774652c156699c72433
      # "on": scheduled runs follow the newest Retake main whose CI passed
      # (test + windows-startup) when files the site serves changed, and an
      # unrelated edit of this file never rolls the site back to an older
      # pinned commit. Roll back deliberately: set "off" and pin the SHA.
      RETAKE_AUTO_FOLLOW: "on"
    steps:
      - name: Resolve the Retake commit to deploy
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          MODE: ${{ inputs.mode || '' }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const SHA = /^[0-9a-f]{40}$/;
          const api = async (path) => {
            const response = await fetch('https://api.github.com/repos/umitalgan061-sudo/retake' + path, {
              headers: { Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + process.env.GH_TOKEN, 'User-Agent': 'retake-hosting-release' },
              signal: AbortSignal.timeout(20000)
            });
            if (!response.ok) throw new Error('GITHUB_' + response.status + ' ' + path.split('?')[0]);
            return response.json();
          };
          const liveCommit = async () => {
            try {
              const url = new URL('https://retake06-ua.web.app/retake-release.json');
              url.searchParams.set('t', String(Date.now()));
              const response = await fetch(url, { cache: 'no-store', signal: AbortSignal.timeout(15000) });
              const body = response.ok ? await response.json() : null;
              return SHA.test(body?.commit || '') ? body.commit : null;
            } catch { return null; }
          };
          // Files the site serves: everything the hosting config does not ignore.
          const served = (path) => !/^(?:tools|tests|docs|\.github|functions|worker|ios|models)\//.test(path)
            && !/\.(?:md|py|ps1)$/i.test(path);
          const done = (sha, deploy, reason) => {
            appendFileSync(process.env.GITHUB_OUTPUT, `deploy=${deploy}\nsha=${sha}\n`);
            if (deploy) appendFileSync(process.env.GITHUB_ENV, `RELEASE_SHA=${sha}\n`);
            const line = `Retake site: ${deploy ? 'deploy ' + sha.slice(0, 7) : 'no deploy'} (${reason}).`;
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, line + '\n');
            console.log((deploy ? '' : '::notice::') + line);
          };
          const main = async () => {
          const pinned = process.env.RETAKE_RELEASE_SHA;
          if (!SHA.test(pinned)) throw new Error('RETAKE_RELEASE_SHA must be a full 40-character commit SHA.');
          const follow = process.env.EVENT === 'schedule' || process.env.MODE === 'follow';
          const auto = process.env.RETAKE_AUTO_FOLLOW === 'on';
          const live = await liveCommit();
          if (!follow) {
            if (process.env.EVENT === 'push' && auto && live && live !== pinned) {
              const relation = await api(`/compare/${live}...${pinned}`).catch(() => null);
              if (relation?.status === 'behind') return done(pinned, false, `pinned ${pinned.slice(0, 7)} is older than live ${live.slice(0, 7)}; set RETAKE_AUTO_FOLLOW off to roll back`);
            }
            return done(pinned, true, 'pinned release');
          }
          if (!auto) return done(pinned, false, 'RETAKE_AUTO_FOLLOW is off');
          const head = String((await api('/commits/main')).sha || '');
          if (!SHA.test(head)) throw new Error('RETAKE_MAIN_UNKNOWN');
          if (head === live) return done(head, false, 'newest Retake main is already live');
          const runs = (await api(`/commits/${head}/check-runs?per_page=100`)).check_runs || [];
          const latest = (name) => runs.filter((run) => run.name === name).sort((a, b) => b.id - a.id)[0];
          const failed = ['test', 'windows-startup'].filter((name) => latest(name)?.conclusion !== 'success');
          if (failed.length) return done(head, false, `Retake CI not green for ${head.slice(0, 7)}: ${failed.join(', ')}`);
          if (live) {
            const relation = await api(`/compare/${live}...${head}`).catch(() => null);
            if (!relation) return done(head, false, `could not compare live ${live.slice(0, 7)} with Retake main`);
            if (relation.status !== 'ahead') return done(head, false, `Retake main is ${relation.status} of live ${live.slice(0, 7)}`);
            const files = (relation.files || []).map((file) => file.filename).filter(served);
            if (!files.length && (relation.files || []).length < 300) return done(head, false, 'no site file changed since the live release');
          }
          return done(head, true, live ? 'site files changed on green Retake main' : 'live release unknown');
          };
          await main();
          JS

      - name: Check out the verified Retake source commit only
        if: steps.resolve.outputs.deploy == 'true'
        uses: actions/checkout@v4
        with:
          repository: umitalgan061-sudo/retake
          ref: ${{ steps.resolve.outputs.sha }}
          persist-credentials: false

      - name: Confirm the checked-out tree is exactly the release commit
        if: steps.resolve.outputs.deploy == 'true'
        shell: bash
        run: |
          if ! printf '%s' "$RELEASE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo '::error::RELEASE_SHA must be a full 40-character commit SHA.'
            exit 1
          fi
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$RELEASE_SHA" ]; then
            echo "::error::Checked out $actual, expected $RELEASE_SHA; nothing deployed."
            exit 1
          fi
          echo "Deploying Retake source $actual"

      - name: Set up Node.js
        if: steps.resolve.outputs.deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'

      - name: Prepare strict single-site Hosting-only release
        if: steps.resolve.outputs.deploy == 'true'
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const config = JSON.parse(readFileSync('firebase.json', 'utf8'));
          const h = config?.hosting;
          if (!h || h.target !== 'retake06' || h.public !== '.' ||
              process.env.FIREBASE_PROJECT_ID !== 'projelerim-8fecd' ||
              process.env.RETAKE_SITE_ID !== 'retake06-ua') {
            throw new Error('RETAKE_HOSTING_TARGET_MISMATCH');
          }
          if (!Array.isArray(h.ignore) || !Array.isArray(h.headers)) {
            throw new Error('RETAKE_HOSTING_GUARDRAILS_MISSING');
          }
          // In contrast with the source firebase.json, this temporary config
          // has NO functions, database, rules, hooks, or other site targets.
          const hosting = {
            public: '.',
            site: 'retake06-ua',
            ignore: [...new Set([
              ...h.ignore, 'firebase-release.json', '.github/**', '.git/**',
              'node_modules/**', 'tools/**', 'models/**', 'functions/**',
              'worker/**', 'tests/**', 'docs/**', 'ios/**'
            ])],
            headers: h.headers,
            ...(Array.isArray(h.rewrites) ? { rewrites: h.rewrites } : {}),
            ...(Array.isArray(h.redirects) ? { redirects: h.redirects } : {})
          };
          writeFileSync('firebase-release.json', JSON.stringify({ hosting }, null, 2) + '\n');
          writeFileSync('retake-release.json', JSON.stringify({
            commit: process.env.RELEASE_SHA, site: process.env.RETAKE_SITE_ID
          }) + '\n');
          console.log('Validated exact Retake source SHA and isolated single-site Hosting config.');
          JS

      - name: Authenticate with existing Firebase project service account
        if: steps.resolve.outputs.deploy == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HAFIZE_UA }}
        shell: bash
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo '::error::Firebase service account is missing; Retake live deploy not attempted.'
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/retake-firebase-sa.json"
          chmod 600 "$RUNNER_TEMP/retake-firebase-sa.json"
          node - "$RUNNER_TEMP/retake-firebase-sa.json" <<'JS'
          const fs = require('node:fs');
          const account = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (account.type !== 'service_account' || account.project_id !== 'projelerim-8fecd')
            throw new Error('FIREBASE_SERVICE_ACCOUNT_PROJECT_MISMATCH');
          console.log('Verified project-specific service account without printing private data.');
          JS

      - name: Deploy ONLY the Retake Hosting site
        if: steps.resolve.outputs.deploy == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/retake-firebase-sa.json
        shell: bash
        run: |
          npx --yes firebase-tools@15.0.0 deploy --only hosting \
            --project "$FIREBASE_PROJECT_ID" \
            --config firebase-release.json \
            --non-interactive

      - name: Verify public Retake release marker from target site
        if: steps.resolve.outputs.deploy == 'true'
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const url = new URL('https://retake06-ua.web.app/retake-release.json');
          url.searchParams.set('sha', process.env.RELEASE_SHA);
          let passed = false;
          for (let attempt = 0; attempt < 6; attempt++) {
            try {
              const response = await fetch(url, {
                cache: 'no-store',
                signal: AbortSignal.timeout(12000)
              });
              if (response.ok) {
                const data = await response.json();
                if (data?.commit === process.env.RELEASE_SHA &&
                    data?.site === process.env.RETAKE_SITE_ID) {
                  passed = true;
                  break;
                }
              }
            } catch { /* CDN propagation delay */ }
            if (attempt < 5) await new Promise(resolve => setTimeout(resolve, 5000));
          }
          if (!passed) {
            console.error('::error::Retake live site did not serve the expected release.');
            process.exitCode = 1;
          } else {
            console.log('Verified live Retake Firebase Hosting for ' + process.env.RELEASE_SHA);
          }
          JS

      - name: Verify the live app files are the released bytes, not only the marker
        if: steps.resolve.outputs.deploy == 'true'
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          const files = ['index.html', 'app.js', 'sw.js', 'src/quality.js'];
          const digest = (data) => createHash('sha256').update(data).digest('hex');
          const pending = new Set(files);
          for (let attempt = 0; attempt < 8 && pending.size; attempt++) {
            for (const file of [...pending]) {
              try {
                const url = new URL('https://retake06-ua.web.app/' + file);
                url.searchParams.set('sha', process.env.RELEASE_SHA);
                const response = await fetch(url, { cache: 'no-store', signal: AbortSignal.timeout(12000) });
                if (!response.ok) continue;
                const live = Buffer.from(await response.arrayBuffer());
                if (digest(live) === digest(readFileSync(file))) pending.delete(file);
              } catch { /* CDN propagation delay */ }
            }
            if (pending.size && attempt < 7) await new Promise(resolve => setTimeout(resolve, 5000));
          }
          if (pending.size) {
            console.error('::error::Live files differ from release ' + process.env.RELEASE_SHA + ': ' + [...pending].join(', '));
            process.exitCode = 1;
          } else {
            console.log('Live index.html, app.js, sw.js and src/quality.js match ' + process.env.RELEASE_SHA);
          }
          JS

      - name: Remove temporary Firebase credential
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/retake-firebase-sa.json"
