name: Hafize quality

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily independent quality checks even when the free web backend is asleep.
    - cron: '17 0 * * *'

permissions:
  contents: read

concurrency:
  group: hafize-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['24.21.0', '26.10.0']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Modern checks
        run: npm run check:modern

      - name: Production build
        run: npm run build

      - name: Native backend startup smoke (no credentials)
        run: node scripts/native-backend-boot-smoke.mjs

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  legacy-suite:
    name: Full regression suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Offline expert evolution report
        run: node scripts/daily-evolution-report.mjs --report
      - name: Retain daily offline report
        if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-artifact@v4
        with:
          name: hafize-evolution-report
          path: hafize-evolution-report.json
          retention-days: 7
          if-no-files-found: warn
      - name: Full Vitest suite
        run: npm run test:modern -- --reporter=default --reporter=json --outputFile.json=hafize-vitest-results.json
      - name: Daily subsystem evidence
        if: ${{ always() }}
        run: node scripts/daily-domain-quality.mjs --report
      - name: Retain domain quality report
        if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-artifact@v4
        with:
          name: hafize-domain-quality
          path: hafize-domain-quality.json
          retention-days: 14
          if-no-files-found: warn
