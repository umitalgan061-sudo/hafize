name: Hafize quality

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hafize-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['24.21.0', '26.10.0']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Modern checks
        run: npm run check:modern

      - name: Release health unit tests
        run: node --test scripts/site-release-health.test.mjs

      - name: Validate Firebase preview recovery mapping
        run: node scripts/test-firebase-recovery-config.mjs

      - name: Production build
        run: npm run build

      - name: Verify built HTML asset references
        run: node scripts/site-release-health.mjs --local

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  legacy-suite:
    name: Full regression suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Full Vitest suite
        run: npm run test:modern

  live-site-diagnostics:
    name: Firebase live (read-only)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/fix/hafize-site-recovery-20261120')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          package-manager-cache: false

      - name: Check live HTML, static bundles and backend health (no secrets or writes)
        run: node scripts/site-release-health.mjs --live https://hafize-ua.web.app/
