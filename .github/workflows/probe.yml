name: Hafize sunucu yoklaması
on:
  push:
    branches: [claude/cloudflare-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch
        run: |
          B=https://hafize-23465.web.app
          for p in /index.html /hafize-uyum.js; do
            echo "@@@@@ BEGIN $p"
            curl -sS -m 30 "$B$p" | base64 -w0; echo
            echo "@@@@@ END $p"
          done
