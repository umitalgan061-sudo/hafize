<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f7f5ef" />
  <title>Hafize · Çevrimdışı</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f5ef;
      color: #252824;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
    }
    main {
      width: min(520px, 100%);
      padding: 28px;
      border: 1px solid #dedbd2;
      border-radius: 22px;
      background: #fffdfa;
      box-shadow: 0 22px 60px rgba(43, 48, 43, 0.12);
      text-align: center;
    }
    img {
      width: 76px;
      height: 76px;
      border-radius: 24px;
      object-fit: cover;
    }
    h1 { margin: 18px 0 10px; font-family: Georgia, serif; font-size: 32px; font-weight: 500; }
    p { margin: 0; color: #73766f; line-height: 1.65; }
    a {
      display: inline-block;
      margin-top: 22px;
      padding: 11px 16px;
      border-radius: 11px;
      background: #5f7f70;
      color: #fff;
      font-weight: 650;
      text-decoration: none;
    }
    a:focus-visible { outline: 3px solid #3f6556; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img src="/hafize.jpeg" alt="Hafize" />
    <h1>Şu anda çevrimdışısın</h1>
    <p>
      Hafize'nin sohbet ve araç çağrıları sunucu bağlantısı gerektirir. Uygulama kabuğu cihazında hazır;
      bağlantın geri geldiğinde yeniden deneyebilirsin.
    </p>
    <a href="/">Yeniden dene</a>
  </main>
</body>
</html>
