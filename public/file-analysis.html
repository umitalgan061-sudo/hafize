<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dosya analizi · Hafize</title><link rel="stylesheet" href="/studio.css"><script type="module" src="/typed-build/file-analysis.js"></script></head>
<body><main><a href="/">← Hafize</a><h1>Dosya analizi</h1>
<label>Dosya türü <select id="kind"><option value="csv">CSV veri tablosu</option><option value="diff">Git diff / patch</option></select></label>
<label>Dosyadan aç <input id="upload" type="file" accept=".csv,.tsv,.patch,.diff,.txt"></label>
<label>İçerik<textarea rows="7" id="source" placeholder="Dosya seç veya buraya yapıştır"></textarea></label>
<div id="csv-controls"><label>Sütun ayırıcı <select id="delimiter"><option value=";">Noktalı virgül</option><option value=",">Virgül</option><option value="tab">Sekme</option></select></label>
<label>Ondalık ayırıcı <select id="decimal"><option value=",">Virgül (12,5)</option><option value=".">Nokta (12.5)</option></select></label></div>
<button id="analyze">İncele</button><section id="grouping" hidden><label>Gruplama sütunu <select id="key"></select></label><label>Sayısal sütun <select id="metric"></select></label><button id="calc">Toplam ve ortalama hesapla</button></section>
<p role="status" id="status"></p><div id="output" style="overflow-x:auto"></div><button id="download">Görünen tabloyu JSON indir</button><button id="chat" hidden>Sohbete taslak olarak aktar</button></main></body></html>
